repo_directory: html
name: Spark@AGU
favicon: assets/images/esip-favicon.png
apply: false

# Site phase: controls whether the page recruits speakers or presents the lineup.
#   cfp    - call for speakers open; agenda hidden; last year's lineup shown
#   lineup - speakers and agenda are set; normal event presentation
# To flip the site back to lineup mode in November, see MAINTAINING.md.
event_phase: cfp

# Call-for-speakers settings (only used when event_phase: cfp).
# If deadline / deadline_iso are unset or "TODO", the "Applications close…"
# sentence and the countdown are hidden rather than shown broken.
cfp:
  apply_url: "https://docs.google.com/forms/d/e/1FAIpQLScTkvrNJRUdetVxjyQptAaNVlK4DSugfBWX2KuSCKXLvfcIlQ/viewform"
  deadline: "at midnight PT on October 23, 2026"
  deadline_iso: "2026-10-24T00:00:00-07:00"
banner:
  description: ""
  start_date: XX Month
  end_date: XX Month
  event_date: Wednesday, December 9
  event_time: 6:00 PM to 8:30 PM
  year: 2026
  location: East Brother Beer Co. Rec Room · 135 4th St, San Francisco, CA 94103
# Add a button link right under the top (e.g. JupyterBook, url can be local file or https://)
  links:
  # - url: intro.html
  #   title: Event Jupyter Book
  #   new_window: false
  image: assets/images/Spark 2026 - SF Background.png
# The opening session of the event with UTC offset (Pacific Standard Time).
event_countdown: "2026-12-09T18:00:00-08:00"
about:
  description: Ready to <b><i>spark</i></b> conversation? Spark@AGU talks are a dynamic five minutes of exactly 20 auto-advancing slides! This isn't your typical research presentation. Speakers create a theatrical or interactive experience focused on sharing ideas and making new connections. In the spirit of the event, we want to see you break the mold and spark new conversations. If you love discussing science, ideas, and anything that broadens our understanding of the Earth, then Spark@AGU is for you!
  learn_more: https://www.esipfed.org/spark-agu/
applicant_info: false
# Redirect the site to a different domain.
#redirect:
#    url: https://go.somehwere.else
team:
  !include team/team.yaml
speakers:
  !include speakers/speakers.yaml
# Last year's lineup, shown in the Speakers section while event_phase: cfp.
# Same schema as speakers/speakers.yaml so the normal grid renders it.
past_speakers:
  !include past-speakers.yaml
schedule:
  !include schedule.yaml
# TODO(2026): confirm 2026 sponsors, then restore this block (set to a mapping again).
# Past sponsor for reference:
#   description: ''
#   organizations:
#   - name: NASA’s Earth Science Division
#     website: https://science.nasa.gov/earth-science/
#     logo_url: assets/images/NASA-Logo-Large.png
sponsors: false
footer:
  social:
  - icon: github
    icon_pack: fab
    link: https://github.com/ESIPFed
_copy_without_render:
- assets
_extensions:
- jinja_markdown.MarkdownExtension
