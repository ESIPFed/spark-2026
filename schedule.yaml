# Spark@AGU 2026 schedule.
# Date and venue are set; talk titles, leads, and the per-item run-of-show
# times are still TBD until the speaker lineup is confirmed.
timezone: UTC -8 (Pacific Standard Time)
tabs:
- title: Wednesday, December 9, 2026
  date: Wednesday 9 December
  contents:
  - title: Doors Open & Socialize
    description: Grab complimentary food, buy yourself a drink, then get comfortable and ready to have your mind blown!
    time: 18:00 - 18:30
  - title: Welcome & Opening Remarks
    description: Kick-off for Spark@AGU 2026.
    time: 18:30 - 18:40
    leads:
    - Zoe Gentes
  - title: The Memory Keepers of Science
    description: Behind NASA's decades of space observations is an often-unseen group of scientists, engineers, and data specialists. Based on interviews with early data pioneers, this talk shares how their creative problem-solving kept discoveries from being lost. Even as computing tools advance, this human expertise remains essential to keeping scientific data useful for future generations.
    time: 18:40 - 18:45
    leads:
    - Kaylin Bugbee
  - title: A Love Story of the Elements in Earth’s Core
    description: Gold wedding rings symbolize love, and gold has an attraction to iron, too. As early Earth melted, heavy iron sank to form the core, pulling most gold with it. Yet more gold stayed in Earth’s rocky mantle than lab tests predict. This talk shares new experiments showing gold is less drawn to iron during planet formation, proving love is complicated, even in chemistry.
    time: 18:46 - 18:51
    leads: 
    - Jack Sheehan
  - title: A Raindrop's Story and Nutrients in the Great Lakes
    description: Farming feeds the world, yet nutrients washing off fields into rivers and the Great Lakes fuel toxic algae and harm wildlife. Stopping this runoff takes more than using less fertilizer. Weather, soil conditions, timing, frozen ground, and leftover nutrients all play a role. This talk explores how nutrients travel downstream and why clean water requires whole-system solutions.
    time: 18:51 - 18:57
    leads:
    - Jaya Hafner
  - title: One Name, Different Stories - Rethinking How We Define Climate Phenomena
    description: Coastal El Niño, or unusually warm ocean water near Peru and Ecuador, is linked to heavy rain, floods, and landslides. Yet events sharing this label act very differently. 2017 and 2023 brought severe rain, while earlier ones did not. This talk explores whether redefining Coastal El Niño better captures risks to communities, showing how our definitions shape what we see and miss.
    time: 18:58 - 19:03
    leads:
    - Gabrielle Brown
  - title: Feel Free to Move About the Solar System
    description: Some dreams start early in life. I will discuss a design for the sustainer engines of the crewed Mars mission in the context of my childhood dreams and ambitions.
    time: 19:04 - 19:09
    leads:
    - Edgar Bering
  - title: Intermission
    description: Stretch your legs and take some more food and drink.
    time: 19:10 - 19:25
  - title: How to Read Water - and why it rhymes
    description: This talk is about building the perceptual habit of noticing when water is doing the same thing in a new context, and what it does to your relationship with a place when you can suddenly read it in that way. Water is legible everywhere, to anyone willing to learn the alphabet. 
    time: 19:25 - 19:30
    leads:
    - Jeremy Snyder
  - title: Breathless in El Alto - Community Air Monitoring at 4150 Meters
    description: After wildfire smoke closed La Paz classrooms in 2024, I set out to measure air quality in El Alto, Bolivia. When a national strike shut down institutional hosts, neighbors, students, and family stepped in to host sensors. After adjusting sea-level sensors for high altitude, the project shows community science in action.
    time: 19:31 - 19:36
    leads:
    - Jeloska Chavez
  - title: Layers, Lies, and Lunch Breaks - Spatial Thinking for the Future Workforce
    description: We’ve all made a bad map. Mislabeled axes, a choropleth that quietly lied about population, a heat map nobody could read. I will show why those mistakes matter in the workforce and why geospatial tools belong in classrooms long before anyone is applying for a job.  
    time: 19:37 - 19:42
    leads:
    - Nick Okafor
  - title: What are Phenomena?
    description: Key mapping and location standards from OGC and ISO rely on the word phenomena to describe things that happen or exist in space and time—such as real-world features, changing conditions, and samples. Yet none of these core standards actually defines phenomena. This talk asks a simple question - what phenomena do these standards really mean?
    time: 19:43 - 19:48
    leads:
    - David Blodgett
  - title: Closing Remarks & Social
    description: Closing remarks and thanks for coming to another Spark@AGU! Feel free to keep eating and networking.
    time: 19:55 - 20:30
    leads:
    - Zoe Gentes
