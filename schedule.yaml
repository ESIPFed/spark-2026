    - Zoe Gentes
  - title: The Memory Keepers of Science
    description: Behind NASA's decades of space observations is an often-unseen group of scientists, engineers, and data specialists. Based on interviews with early data pioneers, this talk shares how their creative problem-solving kept discoveries from being lost. Even as computing tools advance, this human expertise remains essential to keeping scientific data useful for future generations.
    time: 18:40 - 18:45
    leads:
    - Kaylin Bugbee
  - title: A Love Story of the Elements in Earth’s Core
    description: Gold wedding rings symbolize love, and gold has an attraction to iron, too. As early Earth melted, heavy iron sank to form the core, pulling most gold with it. Yet more gold stayed in Earth’s rocky mantle than lab tests predict. This talk shares new experiments showing gold is less drawn to iron during planet formation, proving love is complicated, even in chemistry.
    time: 18:46 - 18:51
    leads: 
    - Jack Sheehan
  - title: A Raindrop Story: Nutrients in the Great Lakes
    description: Agriculture feeds the world, but nutrients for crop growth can also threaten the health of our waterways. When nutrients make it into lakes, they contribute to harmful algal blooms and damage aquatic life. Preventing nutrient runoff is more complex than just reducing fertilizer use. Effective policy solutions require understanding the whole system.
    time: 18:52 - 18:57
    leads:
    - Jaya Hafner
