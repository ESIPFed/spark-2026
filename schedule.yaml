    description: Behind NASA's decades of space observations is an often-unseen group of scientists, engineers, and data specialists. Based on interviews with early data pioneers, this talk shares how their creative problem-solving kept discoveries from being lost. Even as computing tools advance, this human expertise remains essential to keeping scientific data useful for future generations.
